<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOL 助手 · 召唤师问答</title>
<style>
  :root {
    --bg: #010a13;
    --bg-2: #0a1428;
    --panel: rgba(10, 20, 40, 0.85);
    --gold: #c8aa6e;
    --gold-2: #f0e6d2;
    --gold-dim: #785a28;
    --text: #f0e6d2;
    --text-dim: #a09b8c;
    --red: #c8aa6e;
    --danger: #e84057;
    --border: linear-gradient(180deg, #c8aa6e, #785a28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1e2d4a 0%, transparent 60%),
      linear-gradient(180deg, #010a13 0%, #0a1428 100%);
    background-attachment: fixed;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
    padding: 24px 0;
    border-bottom: 1px solid transparent;
    background:
      linear-gradient(var(--bg-2), var(--bg-2)) padding-box,
      var(--border) border-box;
    border-bottom: 1px solid;
    border-image: linear-gradient(90deg, transparent, #c8aa6e, transparent) 1;
    position: relative;
  }
  header::before, header::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  header::before { left: 10%; }
  header::after { right: 10%; transform: scaleX(-1); }
  h1 {
    font-size: 32px;
    letter-spacing: 4px;
    color: var(--gold-2);
    text-shadow: 0 0 12px rgba(200, 170, 110, 0.4);
    margin-bottom: 6px;
  }
  header p {
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 8px 30px rgba(0,0,0,0.5);
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px; bottom: -1px;
    border: 1px solid transparent;
    background: linear-gradient(135deg, var(--gold), transparent 30%, transparent 70%, var(--gold)) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  .ask-row {
    display: flex;
    gap: 12px;
  }
  #query {
    flex: 1;
    background: #010a13;
    border: 1px solid var(--gold-dim);
    color: var(--gold-2);
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #query:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(200,170,110,0.25);
  }
  #ask-btn {
    background: linear-gradient(180deg, #1e2d4a, #0a1428);
    color: var(--gold-2);
    border: 1px solid var(--gold);
    padding: 0 28px;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  #ask-btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #2a3d5e, #15213b);
    box-shadow: 0 0 16px rgba(200,170,110,0.4);
  }
  #ask-btn:disabled { opacity: 0.5; cursor: wait; }

  .quick {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quick button {
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--text-dim);
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .quick button:hover {
    color: var(--gold-2);
    border-color: var(--gold);
    background: rgba(200,170,110,0.08);
  }

  .status {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .status .expanded {
    color: var(--gold);
    margin-top: 4px;
  }
  .status.error { color: var(--danger); }

  .answer {
    white-space: pre-wrap;
    line-height: 1.8;
    font-size: 15px;
    padding: 16px;
    background: rgba(1, 10, 19, 0.6);
    border-left: 3px solid var(--gold);
    margin-top: 12px;
  }
  .answer.empty { color: var(--text-dim); font-style: italic; }

  .sources {
    margin-top: 20px;
  }
  .sources h3 {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gold-dim);
  }
  .source-item {
    padding: 12px;
    background: rgba(1,10,19,0.4);
    border-left: 2px solid var(--gold-dim);
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .source-item .src {
    display: block;
    margin-top: 6px;
    color: var(--gold-dim);
    font-size: 11px;
    word-break: break-all;
  }

  .terms h3 {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 14px;
  }
  .terms-groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .term-hero {
    background: rgba(1,10,19,0.5);
    border: 1px solid var(--gold-dim);
    padding: 12px;
  }
  .term-hero .hero-name {
    color: var(--gold-2);
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--gold-dim);
  }
  .term-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 4px 0;
    color: var(--text-dim);
  }
  .term-row .slang {
    color: var(--gold);
    font-weight: bold;
    min-width: 18px;
  }
  .term-row .arrow {
    color: var(--gold-dim);
  }
  .term-row .std {
    color: var(--text);
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 40px;
    letter-spacing: 1px;
  }
  .loader {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--gold-dim);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>英雄联盟助手</h1>
    <p>召唤师 · 本地知识库问答</p>
  </header>

  <div class="card">
    <div class="ask-row">
      <input id="query" type="text" placeholder="输入你的问题，例如：锐雯的Q是什么？" autofocus>
      <button id="ask-btn">提问</button>
    </div>
    <div class="quick" id="quick"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="answer empty" id="answer">回答将显示在这里…</div>
    <div class="sources" id="sources" style="display:none">
      <h3>参考依据</h3>
      <div id="source-list"></div>
    </div>
  </div>

  <div class="card terms">
    <h3>术语映射 · 玩家口语 → 标准技能</h3>
    <div class="terms-groups" id="terms-grid"></div>
  </div>

  <footer>Powered by Ollama + FAISS + BGE · 本地推理</footer>
</div>

<script>
const $ = id => document.getElementById(id);

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

async function ask() {
  const q = $('query').value.trim();
  if (!q) return;
  $('ask-btn').disabled = true;
  $('answer').className = 'answer empty';
  $('answer').textContent = '思考中…';
  $('sources').style.display = 'none';
  $('status').className = 'status';
  $('status').innerHTML = '<span class="loader"></span>正在检索知识库并生成回答';

  try {
    const d = await postJSON('/api/ask', {query: q});
    if (d.error) {
      $('status').className = 'status error';
      $('status').textContent = '错误：' + d.error;
      $('answer').className = 'answer empty';
      $('answer').textContent = '回答生成失败';
      if (d.expanded) {
        $('status').innerHTML += '<div class="expanded">扩展问题：' + escapeHtml(d.expanded) + '</div>';
      }
      return;
    }
    $('status').innerHTML = '';
    if (d.expanded && d.expanded !== d.query) {
      $('status').innerHTML = '<span class="expanded">扩展问题：' + escapeHtml(d.expanded) + '</span>';
    }
    $('answer').className = 'answer';
    $('answer').textContent = d.answer || '（无回答）';

    if (d.sources && d.sources.length) {
      $('sources').style.display = 'block';
      $('source-list').innerHTML = d.sources.map(s =>
        '<div class="source-item">' + escapeHtml(s.content) +
        '<span class="src">' + escapeHtml(s.source) + '</span></div>'
      ).join('');
    } else {
      $('sources').style.display = 'none';
    }
  } catch (e) {
    $('status').className = 'status error';
    $('status').textContent = '请求失败：' + e.message;
    $('answer').className = 'answer empty';
    $('answer').textContent = '请求出错';
  } finally {
    $('ask-btn').disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

$('ask-btn').addEventListener('click', ask);
$('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') ask();
});

// 快捷问题
const quickQuestions = [
  '锐雯的Q是什么？',
  '亚索的R是什么？',
  '李青的W是什么？',
  '盖伦的被动是什么？'
];
$('quick').innerHTML = quickQuestions.map(q =>
  `<button data-q="${q}">${q}</button>`
).join('');
$('quick').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') {
    $('query').value = e.target.dataset.q;
    ask();
  }
});

// 加载术语映射（按英雄分组）
fetch('/api/terms').then(r => r.json()).then(d => {
  if (!d.terms) return;
  $('terms-grid').innerHTML = Object.entries(d.terms).map(([hero, list]) =>
    `<div class="term-hero">` +
    `<div class="hero-name">${escapeHtml(hero)}</div>` +
    list.map(t =>
      `<div class="term-row">` +
      `<span class="slang">${escapeHtml(t.slang)}</span>` +
      `<span class="arrow">→</span>` +
      `<span class="std">${escapeHtml(t.standard)}</span>` +
      `</div>`
    ).join('') +
    `</div>`
  ).join('');
}).catch(()=>{});
</script>
</body>
</html>
